name: 'Install Energyplus'
description: 'Installs EnergyPlus'
inputs:
  energyplus-version:
    description: 'EnergyPlus major.minor.patch version'
    required: true
  energyplus-sha:
    description: 'EnergyPlus version SHA'
    required: true
  energyplus-tag:
    description: 'EnergyPlus release tag (defaults to v{energyplus-version})'
    required: false
  energyplus-platform:
    description: 'EnergyPlus platform string (e.g., Linux-Ubuntu22.04, Darwin-macOS12.1). If not specified, auto-detected based on version and OS'
    required: false
  energyplus-arch:
    description: 'EnergyPlus architecture (x86_64 or arm64). If not specified, auto-detected from system architecture'
    required: false

runs:
  using: "composite"
  steps:
    - run: echo "Installing EnergyPlusV${ENERGYPLUS_VERSION}..."
      shell: bash
      env:
        ENERGYPLUS_VERSION: ${{ inputs.energyplus-version }}
    - run: echo "${ACTION_PATH}" >> "$GITHUB_PATH"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
    - run: install.sh
      shell: bash
      env:
        ENERGYPLUS_VERSION: ${{ inputs.energyplus-version }}
        ENERGYPLUS_SHA: ${{ inputs.energyplus-sha }}
        ENERGYPLUS_TAG: ${{ inputs.energyplus-tag }}
        ENERGYPLUS_PLATFORM: ${{ inputs.energyplus-platform }}
        ENERGYPLUS_ARCH: ${{ inputs.energyplus-arch }}
